<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><title>本機圖片複核</title>
<style>body{font:16px system-ui;margin:24px;background:#f2f4f6;color:#202830}button,select,input,textarea{font:inherit;margin:5px;padding:7px}main{display:flex;gap:24px}img{max-width:62vw;max-height:75vh;object-fit:contain;background:white}aside{width:380px}label{display:block}textarea{width:95%;height:90px}.pair{max-width:45vw;max-height:65vh}#status{color:#176545}</style>
<h1>垃圾圖片資料集：人工複核</h1><p>approved＝已完成圖片審核，不代表能判讀殘留。none 必須足以確認無殘留；內部看不清＝unknown＋空白；不適用＝no＋空白。食物與液體並存可設 yes＋空白，備註 mixed；這些空白樣本不進入殘留訓練或比例統計。</p>
<button onclick="mode='images';render()">圖片標註</button><button onclick="loadPairs()">疑似近似圖</button>
<select id="folderFilter" onchange="filter()"><option value="">全部類別</option></select><select id="reviewFilter" onchange="filter()"><option value="">全部狀態</option><option>pending</option><option>approved</option><option>excluded</option></select><input id="searchFilter" placeholder="檔名／相對路徑" oninput="filter()"><select id="originFilter" onchange="filter()"><option value="">全部來源</option><option>original</option><option>generated</option></select><span id="status"></span>
<div id="content"></div>
<script>
const token='__TOKEN__';let rows=[],filtered=[],idx=0,mode='images',pairs=[],pi=0;
const el=id=>document.getElementById(id);
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const img=p=>'/image/'+p.split('/').map(encodeURIComponent).join('/');
async function load(){rows=await(await fetch('/api/rows')).json();let f=el('folderFilter');if(f.options.length===1)[...new Set(rows.map(r=>r.folder))].sort().forEach(x=>f.add(new Option(x,x)));filter(false)}
function filter(reset=true){filtered=rows.filter(r=>(!el('folderFilter').value||r.folder===el('folderFilter').value)&&(!el('reviewFilter').value||r.review_status===el('reviewFilter').value)&&(!el('originFilter').value||r.origin===el('originFilter').value)&&r.image_path.toLowerCase().includes(el('searchFilter').value.toLowerCase()));if(reset)idx=0;render()}
function select(k,options,r){return `<label>${k}<select id="f_${k}">${options.map(o=>`<option value="${o}" ${r[k]===o?'selected':''}>${o||'（空白）'}</option>`).join('')}</select></label>`}
function render(){if(mode==='pairs'){renderPair();return}let r=filtered[idx];if(!r){el('content').innerHTML='沒有圖片';return}el('content').innerHTML=`<p>${idx+1} / ${filtered.length}　${esc(r.image_path)}　${esc(r.group_id)}　${esc(r.split)}　${esc(r.origin)}</p><main><div><img src="${img(r.image_path)}">${r.origin==='generated'?`<p>來源：${esc(r.source_id)}</p><img style="max-height:240px" src="${img(r.source_id.slice(r.source_id.indexOf(':')+1))}">`:''}</div><aside>${select('waste_class',['','general','glass','food_waste','other_recycling'],r)}${select('residual_applicable',['unknown','yes','no'],r)}${select('residual',['','none','food','liquid'],r)}${select('review_status',['pending','approved','excluded'],r)}${select('generation_candidate',['','review','eligible','exclude'],r)}<label>notes<textarea id="f_notes">${esc(r.notes)}</textarea></label><label>複核者<input id="f_visual_review_by" value="${esc(r.visual_review_by)}"></label><p>eligible 僅供單一主要容器清楚、確定無殘留（yes＋none），且新增殘留能合理可見的原圖。候選排除不會刪除原圖。</p><button onclick="move(-1)">上一張</button><button onclick="save()">儲存</button><button onclick="move(1)">下一張</button></aside></main>`}
function move(n){idx=Math.max(0,Math.min(filtered.length-1,idx+n));render()}
async function post(path,b){let res=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json','X-Review-Token':token},body:JSON.stringify(b)});let j=await res.json();if(!res.ok)throw Error(j.error);return j}
async function save(){let r=filtered[idx],u={image_path:r.image_path};document.querySelectorAll('[id^="f_"]').forEach(e=>u[e.id.slice(2)]=e.value);try{await post('/api/annotate',u);Object.assign(r,u);el('status').textContent='已儲存；統計已更新'}catch(e){alert(e.message)}}
async function loadPairs(){pairs=await(await fetch('/api/duplicates')).json();pairs=pairs.filter(p=>p.decision==='pending');mode='pairs';pi=0;render()}
function renderPair(){let p=pairs[pi];if(!p){el('content').innerHTML='無待確認近似圖片';return}el('content').innerHTML=`<p>${pi+1}/${pairs.length} dHash 距離 ${p.dhash_distance}；此為候選，不代表已確認重複。</p><div><img class="pair" src="${img(p.a)}"><img class="pair" src="${img(p.b)}"></div><p>${esc(p.a)}<br>${esc(p.b)}</p><button onclick="pairDecision('same')">確認同一照片／重複版本，合組</button><button onclick="pairDecision('different')">不同照片</button><button onclick="pi++;render()">略過</button>`}
async function pairDecision(decision){let p=pairs[pi];try{await post('/api/duplicate',{a:p.a,b:p.b,decision});pi++;render();await load();el('status').textContent='決定已記錄；同組 split 已同步'}catch(e){alert(e.message)}}
load();
</script></html>
